version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - binary: gloss
    main: ./main.go
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/nalalou/gloss/cmd.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  - name: gloss
    homepage: "https://github.com/nalalou/gloss"
    description: "Render :: directives as live progress panels, badges, and tables in your terminal"
    license: "MIT"
    repository:
      owner: nalalou
      name: homebrew-gloss
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    # Publish the GitHub release even before the Homebrew tap is set up.
    skip_upload: '{{ if eq .Env.HOMEBREW_TAP_TOKEN "" }}true{{ end }}'
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/gloss"]
          end
